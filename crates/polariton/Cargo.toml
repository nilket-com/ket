[package]
name = "polariton"
version = "0.1.0"
edition = "2024"
resolver = "3"
authors = ["Joel Bondurant"]
description = "A strong coupling of data and visualization."

[features]
default = ["toron"]
product-0057-render-evidence = []
toron = [
	"dep:nilket-local",
	"dep:nix",
	"dep:toron-client",
]

[package.metadata.deb]
maintainer = "Joel Bondurant"
copyright = "2026, Joel Bondurant"
license-file = ["../../LICENSE", "0"]
assets = [
	["target/release/polariton", "/usr/bin/polariton", "755"],
]

[dependencies]
arrow-array = "58.3.0"
arrow-buffer = "58.3.0"
arrow-cast = "58.3.0"
arrow-select = "58.3.0"
arrow-csv = "58.3.0"
arrow-ipc = "58.3.0"
arrow-schema = "58.3.0"
async-trait = "0.1.89"
base64 = "0.22.1"
boson = { path = "../../shared/boson" }
bytes = "1.11.1"
chrono = "0.4.41"
chrono-tz = "0.10"
fontdb = "0.23.0"
gcloud-auth = { version = "1.3.0", default-features = false, features = ["rustls-tls", "jwt-rust-crypto"] }
gcloud-bigquery = { version = "1.6.0", default-features = false, features = ["auth", "rustls-tls", "jwt-rust-crypto"] }
gcloud-gax = "1.4.0"
gcloud-googleapis = { version = "1.3.0", features = ["bigquery"] }
iced = { version = "0.14.0", features = ["advanced", "canvas", "image", "tokio"] }
libaryon = { path = "../libaryon" }
kurbo = "0.13.0"
png = "0.18.1"
polars = { version = "0.53.0", features = ["lazy", "parquet", "sql", "ipc_streaming"] }
rand_distr = "0.6.0"
ravif = { version = "0.13.0", default-features = false, features = ["threading"] }
regex = "1.12.3"
resvg = "0.47.0"
rune.workspace = true
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hyper = { version = "1.10.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.4"
sqlparser = "0.61.0"
svg_fmt = "0.4.5"
tiny-skia = "0.12.0"
tokio = { version = "1.50.0", features = ["full"] }
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
tokio-postgres = "0.7.16"
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring", "webpki-roots"] }
tokio-rusqlite = { version = "0.7.0", features = ["bundled"] }
tokio-stream = "0.1.18"
unicode-segmentation = "1.13.2"
zeroize.workspace = true
unicode-width = "0.2.2"
toron-client = { path = "../../nilket/crates/toron-client", optional = true }
nilket-local = { path = "../../nilket/crates/nilket-local", optional = true }
nix = { version = "0.29", features = ["process", "signal"], optional = true }

[dev-dependencies]
iced_wgpu = "0.14.0"
roxmltree = "0.20.0"
trybuild = "1.0.116"

[[test]]
name = "product_0073_session_discovery"
path = "tests/product_0073_session_discovery.rs"
required-features = ["toron"]

[[test]]
name = "product_0057_render_evidence"
path = "tests/product_0057_render_evidence.rs"
required-features = ["product-0057-render-evidence"]
harness = false
