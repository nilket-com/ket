[workspace]
members = ["baryon/crates/*", "polariton"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Joel Bondurant"]

[workspace.dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
bitflags = "2.11.0"
crossterm = "0.29.0"
font8x8 = "0.3.1"
fontdb = "0.23.0"
fontdue = "0.9.3"
image = { version = "0.25.10", default-features = false }
imara-diff = "0.2.0"
memchr = "2.8.0"
libc = "0.2.177"
pulldown-cmark = { version = "0.13.4", default-features = false }
ra_ap_base_db = "0.0.326"
ra_ap_cfg = "0.0.326"
ra_ap_ide = "0.0.326"
ra_ap_ide_db = "0.0.326"
ra_ap_paths = "0.0.326"
ra_ap_project_model = "0.0.326"
ra_ap_syntax = "0.0.326"
ra_ap_vfs = "0.0.326"
ratatui = "0.30.0"
ratatui-image = { version = "10.0.6", default-features = false, features = ["crossterm", "image-defaults"] }
regex-automata = { version = "0.4.14", default-features = true, features = ["meta", "perf"] }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff.git", tag = "v0.4.9" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff.git", tag = "v0.4.9" }
ruff_python_semantic = { git = "https://github.com/astral-sh/ruff.git", tag = "v0.4.9" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff.git", tag = "v0.4.9" }
rune = { version = "0.14.1", default-features = false, features = ["std"] }
rustc-hash = "2.1.2"
sqlparser = { version = "0.61.0", default-features = false, features = ["std"] }
triomphe = "0.1.15"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0
