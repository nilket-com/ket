[workspace]
members = ["crates/*", "shared/boson"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Joel Bondurant"]

[workspace.dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
argon2 = "0.5.3"
bitflags = "2.11.0"
candle-core = { version = "0.11.0", default-features = false }
candle-nn = { version = "0.11.0", default-features = false }
candle-transformers = { version = "0.11.0", default-features = false }
chacha20poly1305 = "0.10.1"
crossterm = "0.29.0"
font8x8 = "0.3.1"
fontdb = "0.23.0"
fontdue = "0.9.3"
image = { version = "0.25.10", default-features = false }
imara-diff = "0.2.0"
memchr = "2.8.0"
libc = "0.2.177"
notify = "8.2.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
rand = "0.10.0"
rayon = "1.11.0"
ra_ap_base_db = "0.0.342"
ra_ap_cfg = "0.0.342"
ra_ap_ide = "0.0.342"
ra_ap_ide_db = "0.0.342"
ra_ap_paths = "0.0.342"
ra_ap_project_model = "0.0.342"
ra_ap_syntax = "0.0.342"
ra_ap_vfs = "0.0.342"
ratatui = "0.30.0"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm", "image-defaults"] }
regex-automata = { version = "0.4.14", default-features = true, features = ["meta", "perf"] }
# No default features: rnx's allocator accounting installs a global allocator.
rnx = { git = "https://github.com/nilket-com/rnx", rev = "b08645d89146a16c9b41a6b4fddd9307aa23b04b", default-features = false, features = ["server-runtime"] }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff.git", tag = "v0.4.9" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff.git", tag = "v0.4.9" }
ruff_python_semantic = { git = "https://github.com/astral-sh/ruff.git", tag = "v0.4.9" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff.git", tag = "v0.4.9" }
rune = { version = "0.14.1", default-features = false, features = ["std"] }
rustc-hash = "2.1.2"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
zeroize = "1.8.2"
sqlparser = { version = "0.62.0", default-features = false, features = ["std"] }
toml = "1.1.3"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
triomphe = "0.1.15"
unicode-segmentation = "1.13.2"
unicode-width = "0.2.2"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
url = "2.5.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0

# Measurement profiles. Both exist because `cargo test --release` cannot build
# this workspace at all: iced_core gates its null renderer behind
# `#[cfg(debug_assertions)]`, and polariton's widget tests construct
# `iced::Element<'static, _, _, ()>`. `debug-assertions = true` is therefore
# forced, not chosen, and `panic = "unwind"` is required by the test harness.
# Neither profile is a shipping-binary benchmark for that reason.

# Routine performance iteration. Thin LTO parallelises across codegen units, so
# a rebuild costs minutes rather than the better part of an hour.
[profile.evidence]
inherits = "release"
lto = "thin"
codegen-units = 16
debug-assertions = true
panic = "unwind"

# Shipping-grade codegen calibration. Used rarely, to check how far `evidence`
# numbers sit from full-optimization codegen before those numbers are quoted.
[profile.evidence-calibration]
inherits = "release"
lto = "fat"
codegen-units = 1
debug-assertions = true
panic = "unwind"

# Workspace debuginfo stays out of the linked binary; dependencies keep their
# optimization but drop debuginfo entirely. Optimized deps with full debuginfo
# produced a 3.7 GB polariton binary whose per-run link and page-in stalled the
# whole desktop.
[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2
debug = false
