[workspace]
members = [
    "crates/*",
    "crates/wendelon/crates/*"
]
resolver = "3"

[workspace.dependencies]
arrow = { version = "58.3.0", features = ["chrono-tz", "ipc_compression"] }
arrow-schema = { version = "58.3.0", features = ["serde"] }
postcard = { version = "1.0", default-features = false, features = ["alloc", "use-std"] }
polars = { version = "0.54.4", default-features = false }
polars-sql = { version = "0.54.4", default-features = false }
tokio = { version = "1.37", features = ["full"] }

# ADR 474: profiling needs symbols; `release` is stripped for shipping, so the
# ladder's profiling runs use this profile (identical codegen, symbols kept).
[profile.profiling]
inherits = "release"
debug = 1
strip = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0

[profile.fips]
inherits = "release"
