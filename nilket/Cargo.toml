[workspace]
members = [
    "crates/*",
    "crates/wendelon/crates/*"
]
resolver = "3"

[workspace.dependencies]
arrow = { version = "58.1.0", features = ["ipc_compression"] }
arrow-schema = { version = "58.1.0", features = ["serde"] }
tokio = { version = "1.37", features = ["full"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0

[profile.fips]
inherits = "release"
