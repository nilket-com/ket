# Suite runtime policy.
#
# nextest runs tests from different binaries concurrently. The cargo-test path
# exposes cross-process contention while libtest runs binaries one after
# another. cargo-cgroup defaults to one test thread per cpuset CPU (ADR 0694);
# stress runs set an explicit count (ADR 0695).
#
# `distributed_process_test` spawns fixture-worker processes and coordinates over
# loopback. It ran in a one-thread test-group because two of its tests at once
# parked every process in a futex wait that never returned. That hang is an
# unexplained defect candidate, not a fixed one: it did not recur in 25 nextest
# stress iterations without the group nor in a libtest run at 1024 threads on
# 2026-10-20, but nothing explains why. The group is gone so the suite keeps
# testing it; ladder driver v5 stresses the binary every run, and every v5
# step runs under a timeout so a recurrence ends instead of hanging the run.
#
# Everything stays parallel; serial execution is only for noise-sensitive tests,
# in a lane of at most 2 CPUs. A test that fails only in parallel is a defect
# candidate, not a flake: see nilket/plans/ops/test_parallelism.md before adding
# any serialization here. A group limited to one thread must also be listed in
# serial-allowlist.txt.

[profile.default]
# Bound a hang instead of waiting on it. A stuck test is terminated after
# 20 x 60s and reported as a failure, which is information; an unbounded wait is
# not. Generous enough that genuinely slow tests are unaffected.
slow-timeout = { period = "60s", terminate-after = 20 }

# The ignored live local-profile tests in nilket's `cli_integration` run the real
# supervisor, which binds the profile's fixed public endpoints (127.0.0.1:7001,
# 7742, 7431-7433). Two at once collide: the second refuses at its own preflight
# ("local creation conflict: Wendelon UDP endpoint 127.0.0.1:7001 is
# unavailable", observed 2026-11-19 when nextest ran two of them together). Their
# in-file mutex serializes them only inside one process, and nextest runs each
# test in a process of its own. This group gives exactly those tests, which must
# exercise the public fixed ports, cross-process exclusion; every other test,
# including the rest of `cli_integration`, keeps running in parallel.
# Toron's `parent_decisions_profile_test` (Wendelon ADR 0120) starts the same
# profile from the binary under test, so its tests join the group too.
[test-groups]
live-local-fixed-ports = { max-threads = 1 }

[[profile.default.overrides]]
filter = '(package(nilket) & binary(cli_integration) & (test(=nilket_toron_sql_file_executes_in_order_and_attributes_results) | test(=nilket_toron_sql_file_stops_with_partial_application_diagnostic) | test(=local_profile_dogfood_contract_survives_restart_and_exposes_catalog) | test(=local_profile_parent_decisions_init_commits_reads_and_survives_restart) | test(=local_profile_parent_decisions_multi_row_delete_is_one_statement) | test(=local_profile_parent_decisions_append_only_table_keeps_identical_rows) | test(=local_profile_public_mutation_outcomes_resolve_on_both_authorities) | test(=local_profile_drop_table_on_both_authorities) | test(=local_profile_parent_death_reaps_roles_and_allows_stale_manifest_restart) | test(=local_profile_parent_decisions_create_table_as_select_publishes_exact_rows) | test(=local_profile_parent_decisions_create_table_as_select_spans_several_chunks) )) | (package(toron) & binary(parent_decisions_profile_test))'
test-group = 'live-local-fixed-ports'
