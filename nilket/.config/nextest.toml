# Suite runtime policy.
#
# nextest runs tests from different binaries concurrently. The cargo-test path
# exposes cross-process contention while libtest runs binaries one after
# another. cargo-cgroup defaults to one test thread per cpuset CPU (ADR 0694);
# explicit 1024 stress exposes interleavings that had always been latent.
#
# `distributed_process_test` spawns fixture-worker processes and coordinates over
# loopback. It ran in a one-thread test-group because two of its tests at once
# parked every process in a futex wait that never returned. That hang is an
# unexplained defect candidate, not a fixed one: it did not recur in 25 nextest
# stress iterations without the group nor in a libtest run at 1024 threads on
# 2026-10-20, but nothing explains why. The group is gone so the suite keeps
# testing it; ladder driver v5 stresses the binary every run, and every v5
# step runs under a timeout so a recurrence ends instead of hanging the run.
#
# Everything stays parallel; serial execution is only for noise-sensitive tests,
# in a lane of at most 2 CPUs. A test that fails only in parallel is a defect
# candidate, not a flake: see nilket/plans/ops/test_parallelism.md before adding
# any serialization here. A group limited to one thread must also be listed in
# serial-allowlist.txt.

[profile.default]
# Bound a hang instead of waiting on it. A stuck test is terminated after
# 20 x 60s and reported as a failure, which is information; an unbounded wait is
# not. Generous enough that genuinely slow tests are unaffected.
slow-timeout = { period = "60s", terminate-after = 20 }
