[package]
name = "toron-tpch"
version = "0.1.0"
edition = "2024"
publish = false

# ADR 261: a repo-local TPC-H *reachability* harness. Depends on `toron`; the `toron` library must NOT
# depend on this crate (architecture guard). Dev-mode data is generated from the pure-Rust `tpchgen`
# row structs into workspace-Arrow arrays — deliberately NOT the Arrow-output generator variant, which
# pins a different Arrow major than Toron and would cross a second `RecordBatch` type boundary.

[[bin]]
name = "toron-tpch"
path = "src/main.rs"

[[bin]]
name = "toron-bench"
path = "src/bin/toron-bench.rs"

[features]
polars-sql-reference = ["dep:polars", "dep:polars-sql"]

[dependencies]
toron = { path = "../toron" }
wendelon = { path = "../wendelon" }
arrow.workspace = true
tokio.workspace = true
async-trait = "0.1"
futures = "0.3"
libc = "0.2"
parquet = "58.3.0"
postcard.workspace = true
polars = { workspace = true, optional = true, features = ["lazy", "dtype-decimal", "temporal", "strings", "streaming"] }
polars-sql = { workspace = true, optional = true, features = ["parquet", "dtype-decimal", "semi_anti_join"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tpchgen = "2.0.2"
