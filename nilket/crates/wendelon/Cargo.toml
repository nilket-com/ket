[workspace]
resolver = "3"

[package]
name = "wendelon"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["non-fips"]
non-fips = ["aws-lc-rs/non-fips"]
fips = ["aws-lc-rs/fips"]

[dependencies]
arrow = { version = "58.1.0", features = ["ipc_compression"] }
async-trait = "0.1"
aws-lc-rs = { version = "1.14", default-features = false }
blake3 = "1.5"
bytemuck = { version = "1.15", features = ["derive", "min_const_generics"] }
bytes = "1.6"
dashmap = "6.1.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
io-uring = "0.7.11"
libc = "0.2"
opendal = { version = "0.55", features = ["services-s3"] }
openraft = { version = "0.9", features = ["storage-v2", "serde"] }
postcard = { version = "1.0", default-features = false, features = ["alloc", "use-std"] }
quinn = "0.11"
rand = "0.10.1"
redb = "4.0.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11.19"
thiserror = "2.0.18"
tokio = { version = "1.37", features = ["full"] }
tokio-rustls = "0.26"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4", "fast-rng", "bytemuck"] }
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0

[[bench]]
name = "quic_hot_path"
harness = false

[[bench]]
name = "slab_crypto"
harness = false
