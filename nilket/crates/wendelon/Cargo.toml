[workspace]
resolver = "3"
members = ["crates/wendelon-client"]

[package]
name = "wendelon"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["non-fips"]
non-fips = ["aws-lc-rs/non-fips"]
fips = ["aws-lc-rs/fips"]
audit-kafka = ["dep:rdkafka"]
otlp-http = []
otlp-grpc = ["dep:h2", "dep:http"]

[dependencies]
arrow = { version = "58.1.0", features = ["ipc_compression"] }
async-trait = "0.1"
aws-lc-rs = { version = "1.14", default-features = false }
base64 = "0.22"
blake3 = "1.5"
bytemuck = { version = "1.15", features = ["derive", "min_const_generics"] }
bytes = "1.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "precomputed-tables"] }
dashmap = "6.1.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
# ADR 057 rewrites Arrow IPC RecordBatch flatbuffer messages after
# compacting/materializing body buffers; Arrow's public Schema APIs do not
# expose that metadata rewrite path.
flatbuffers = "25.12.19"
h2 = { version = "0.4", optional = true }
http = { version = "1", optional = true }
io-uring = "0.7.11"
libc = "0.2"
lz4_flex = "0.13"
opendal = { version = "0.55", features = ["services-b2", "services-gcs", "services-s3"] }
openraft = { version = "0.9", features = ["storage-v2", "serde"] }
postcard = { version = "1.0", default-features = false, features = ["alloc", "use-std"] }
quinn = "0.11"
rand = "0.10.1"
rdkafka = { version = "0.36", default-features = false, features = ["cmake-build", "ssl"], optional = true }
redb = "4.0.0"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "http2", "blocking", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11.19"
scrypt = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.37", features = ["full"] }
tokio-rustls = "0.26"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
uuid = { version = "1.8", features = ["v4", "fast-rng", "bytemuck"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
wendelon-client = { path = "crates/wendelon-client", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0

[profile.fips]
inherits = "release"

[[bench]]
name = "quic_hot_path"
harness = false

[[bench]]
name = "slab_crypto"
harness = false

