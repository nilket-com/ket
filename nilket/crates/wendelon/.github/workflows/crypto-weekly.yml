name: Crypto Weekly

on:
  schedule:
    - cron: '0 7 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w4-nonce-ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: W4 nonce injectivity ladder
        run: bash ci/check_w4_nonce_ladder.sh
