[package]
name = "nilket"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "nilket"
path = "src/main.rs"

[dependencies]
fs2 = "0.4"
libc = "0.2"
nix = { version = "0.29", features = ["process", "signal"] }
nilket-local = { path = "../nilket-local" }
signal-hook = "0.3"
toml = "0.8"
toron = { path = "../toron" }
toron-client = { path = "../toron-client" }
uuid = { version = "1.23", features = ["serde", "v4", "v7"] }
wendelon = { path = "../wendelon" }
