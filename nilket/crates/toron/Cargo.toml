[package]
name = "toron"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
arrow.workspace = true
arrow-schema.workspace = true
tokio.workspace = true
async-trait = "0.1"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_bytes = "0.11"
postcard = { version = "1.0", features = ["alloc"] }
bytemuck = { version = "1.16", features = ["derive"] }
futures = "0.3"
rune = "0.13"
sqlparser = "0.54"
rand = "0.10"
thiserror = "2"
uuid = { version = "1.23", features = ["serde", "v7"] }
twox-hash = { version = "2.1.2", default-features = false, features = ["xxhash3_64"] }
aws-lc-rs = { version = "1.14", default-features = false }
wendelon = { path = "../wendelon" }
wendelon-client = { path = "../wendelon/crates/wendelon-client" }

[[bench]]
name = "storage_execution"
harness = false

[[bench]]
name = "distributed_runtime"
harness = false

[[bench]]
name = "distributed_inner_equi_join"
harness = false
