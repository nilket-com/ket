[package]
name = "observability"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
http = ["dep:tokio"]
audit = [
    "dep:blake3",
    "dep:ed25519-dalek",
    "dep:rand",
    "dep:serde",
    "dep:serde_json",
]
non-fips = ["audit"]
fips = ["audit", "dep:aws-lc-rs", "aws-lc-rs/fips"]
kafka = ["audit", "dep:rdkafka"]

[dependencies]
aws-lc-rs = { version = "1.14", default-features = false, optional = true }
blake3 = { version = "1.5", optional = true }
ed25519-dalek = { version = "2.1", features = ["rand_core"], optional = true }
rand = { version = "0.10.1", optional = true }
rdkafka = { version = "0.36", default-features = false, features = ["cmake-build", "ssl"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
tokio = { version = "1.37", default-features = false, features = ["io-util"], optional = true }

[dev-dependencies]
tokio = { version = "1.37", default-features = false, features = ["io-util", "macros", "rt"] }
