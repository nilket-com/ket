[package]
name = "observability"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
http = ["dep:tokio"]
telemetry = []
otlp-http = [
    "telemetry",
    "dep:rand",
    "dep:reqwest",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
]
otlp-grpc = [
    "telemetry",
    "dep:bytes",
    "dep:h2",
    "dep:http",
    "dep:rand",
    "dep:rustls-pki-types",
    "dep:tls-pki",
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:tracing",
    "dep:tracing-subscriber",
]
audit = [
    "dep:blake3",
    "dep:ed25519-dalek",
    "dep:rand",
    "dep:serde",
    "dep:serde_json",
]
non-fips = ["audit"]
fips = ["audit", "dep:aws-lc-rs", "aws-lc-rs/fips"]
kafka = ["audit", "dep:rdkafka"]

[dependencies]
aws-lc-rs = { version = "1.14", default-features = false, optional = true }
blake3 = { version = "1.5", optional = true }
bytes = { version = "1.6", optional = true }
ed25519-dalek = { version = "2.1", features = ["rand_core"], optional = true }
h2 = { version = "0.4", optional = true }
http = { version = "1", optional = true }
rand = { version = "0.10.1", optional = true }
rdkafka = { version = "0.36", default-features = false, features = ["cmake-build", "ssl"], optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "http2"], optional = true }
rustls-pki-types = { version = "1.10", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
tls-pki = { path = "../tls-pki", optional = true }
tokio = { version = "1.37", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"], optional = true }
tokio-rustls = { version = "0.26", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["registry"], optional = true }

[dev-dependencies]
tokio = { version = "1.37", default-features = false, features = ["io-util", "macros", "rt"] }
