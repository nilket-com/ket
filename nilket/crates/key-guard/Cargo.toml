[package]
name = "key-guard"
version = "0.1.0"
edition = "2024"
publish = false
description = "Opens a private key file only when its access control admits no one but its owner."

[dependencies]
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Security_Authorization",
	"Win32_System_Pipes",
	"Win32_System_Threading",
] }
