[package]
name = "tls-pki"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
key-guard = { path = "../key-guard" }
rcgen = { version = "0.12", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.10"
thiserror = "2"

