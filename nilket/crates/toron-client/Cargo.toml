[package]
name = "toron-client"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
boson = { path = "../../../shared/boson" }
postcard = { version = "1.0", default-features = false, features = ["alloc", "use-std"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "2"
tls-pki = { path = "../tls-pki" }
tokio = { version = "1.37", features = ["full"] }
uuid = { version = "1.23", features = ["serde", "v7"] }

[dev-dependencies]
toml = "0.8"
